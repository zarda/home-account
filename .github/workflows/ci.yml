name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A plain dispatch runs CI only. The inputs exist for deploys that change
  # detection cannot see — a redeploy of unchanged code, or the functions
  # re-pin after a secret rotation (docs/feedback.md).
  workflow_dispatch:
    inputs:
      deploy_web:
        description: Deploy hosting, rules and indexes after CI passes
        type: boolean
        default: false
      deploy_functions:
        description: Deploy functions after CI passes
        type: boolean
        default: false

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The functions workspace compiles and tests in seconds and needs no
      # environment stubs, so it fails fast ahead of the Angular pipeline.
      - name: Functions build & test
        run: |
          npm --prefix functions ci
          npm --prefix functions test

      # src/environments/environment.ts re-exports from .vscode/environment
      # (gitignored, holds local Firebase keys), so lint/test type-checking needs
      # a stub. The production build replaces environment.ts with the gitignored
      # environment.prod-local.ts, so the build step needs that stub too.
      - name: Create local environment stubs
        run: |
          mkdir -p .vscode
          cat > .vscode/environment.ts << 'EOF'
          export const environment = {
            production: false,
            firebase: {
              apiKey: 'ci-stub',
              authDomain: 'ci-stub',
              projectId: 'ci-stub',
              storageBucket: 'ci-stub',
              messagingSenderId: 'ci-stub',
              appId: 'ci-stub',
              measurementId: 'ci-stub'
            },
            donationUrlPaypal: ''
          };
          EOF
          cat > src/environments/environment.prod-local.ts << 'EOF'
          export const environment = {
            production: true,
            firebase: {
              apiKey: 'ci-stub',
              authDomain: 'ci-stub',
              projectId: 'ci-stub',
              storageBucket: 'ci-stub',
              messagingSenderId: 'ci-stub',
              appId: 'ci-stub',
              measurementId: 'ci-stub'
            },
            donationUrlPaypal: ''
          };
          EOF

      - name: Lint
        run: npm run lint

      # Lint just ran, but a flat-config collision can leave an import ban
      # written in eslint.config.js and applied to nothing — the config still
      # reads as enforced and lint stays green. This resolves the config for
      # representative files of each population and fails when a ban is gone.
      - name: Check lint guards
        run: npm run lint-guards:check

      # Catches translation keys the source references but no locale defines.
      # Key-set parity between locales is covered by the unit suite.
      - name: Check translation keys
        run: npm run i18n:check

      # Keeps docs/analytics.md honest: every tracked event must appear in the
      # registry table, every row must have a call site, and the screen table
      # must match the configured routes.
      - name: Check analytics registry
        run: npm run analytics:check

      # Keeps the three provider services sending the same prompt for the same
      # task: every registered prompt must reach every provider (or be listed as
      # a documented gap), must be documented in docs/prompts.md, and no provider
      # may grow a new inline prompt literal.
      - name: Check prompt registry
        run: npm run prompts:check

      # The emulator does not enforce composite indexes, so only this check
      # notices firestore.indexes.json falling behind the filter combinations
      # buildTransactionWhere can emit.
      - name: Check Firestore composite indexes
        run: npm run indexes:check

      # deploy-web's --non-interactive deploy (no --force) leans on firebase-tools
      # declining index deletions instead of deploying blind. This keeps a
      # Dependabot major bump from silently changing that contract underneath it.
      - name: Check firebase-tools major version
        run: npm run firebase-tools:check

      # The "Create local environment stubs" step above writes a ci-stub
      # placeholder to the same path the real digest was taken from, so the
      # compare half of prod-env:check would fail here by construction, on
      # every run, not just a drifted secret. Only the checker's own logic
      # is worth proving in this job; the real compare runs in deploy-web,
      # against the actual PROD_ENVIRONMENT_TS secret.
      - name: Self-test the PROD_ENVIRONMENT_TS digest checker
        run: node scripts/check-prod-env.mjs --self-test

      # deploy-web's index wait reaches the Firestore Admin API with a
      # service-account token, so no job outside a deploy can exercise it for
      # real. Its --self-test covers everything that can be proven offline:
      # the state classification, the deadline math, the signed assertion, and
      # the whole token-and-poll loop against a local stub server.
      - name: Self-test the Firestore index wait
        run: node scripts/wait-for-indexes.mjs --self-test

      # G3 in docs/ui-overflow.md: nothing in the app truncates. The script's
      # header always said it ran in CI; now it does. It reads the source, so
      # it catches the text-overflow added next month as well as the sites
      # already swept.
      - name: Check truncation
        run: npm run truncation:check

      # The physical direction still in the tree is frozen per file in the
      # script's baseline; it may only shrink. Above the line is a new
      # margin-left, below it is a ratchet that stopped ratcheting, and both
      # fail — so a conversion slice edits the baseline in its own commit.
      - name: Check direction
        run: npm run direction:check

      - name: Unit tests
        run: npm run test:ci

      # A runtime at UTC cannot tell local-midnight parsing from UTC-midnight
      # parsing — at offset 0 they are the same instant — so the specs whose
      # assertions depend on the zone run again either side of it. Targeted
      # rather than a second full suite; ChromeHeadless inherits TZ from Karma.
      - name: Date specs (non-UTC zones)
        run: |
          TZ=America/New_York npm run test:dates
          TZ=Asia/Tokyo npm run test:dates

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      # Java is required to run the Firebase Storage/Auth emulators.
      - name: Set up Java (Firebase emulators)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Smoke test: real upload/download/delete + storage.rules enforcement
      # against the Firebase emulators (no production project needed; the
      # demo- project id runs the emulators fully offline).
      - name: Smoke test (Firebase emulators)
        run: npm run smoke

      # The same offset-0 blindness as the date specs, against the emulators:
      # the smoke specs that assert period bounds and horizon edges cannot
      # fail at UTC. The alias names the zone-sensitive files and wraps both
      # zone runs in one emulators:exec, so the emulators boot once.
      - name: Smoke date specs (non-UTC zones)
        run: npm run smoke:dates

      - name: Build (production)
        run: npm run build

  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      functions: ${{ steps.filter.outputs.functions }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The diff below needs the pre-push commit, which a depth-1 clone
          # does not have.
          fetch-depth: 0

      # Deploys are gated on what a push to main actually changed. The
      # detection fails open: when the previous commit cannot be resolved
      # (first push, rewritten history), everything deploys — over-deploying
      # re-releases identical content, under-deploying is the failure mode
      # where merged rules protect nobody. A workflow_dispatch run deploys
      # exactly what its inputs ask for; docs, iOS, workflow and markdown
      # changes deploy nothing. The diff disables rename detection and path
      # quoting: a rename collapses to its destination under git's defaults
      # and a non-ASCII path arrives shell-quoted, and either would slip a
      # file past the globs. The two deploy jobs' stand-down checks mirror
      # this case statement, and the "What deploys when" table in
      # docs/deploy.md states all three in prose — the three case statements
      # and that table change together.
      - name: Classify changed files
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "web=${{ inputs.deploy_web }}" >> "$GITHUB_OUTPUT"
            echo "functions=${{ inputs.deploy_functions }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "web=false" >> "$GITHUB_OUTPUT"
            echo "functions=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          if [ -z "$before" ] || ! git cat-file -e "$before" 2>/dev/null; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "functions=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          web=false
          functions=false
          while IFS= read -r f; do
            case "$f" in
              docs/*|ios/*|.github/*|*.md|.gitignore|LICENSE) ;;
              functions/*) functions=true ;;
              firebase.json) web=true; functions=true ;;
              *) web=true ;;
            esac
          done < <(git -c core.quotePath=false diff --no-renames --name-only "$before" "${{ github.sha }}")
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "functions=$functions" >> "$GITHUB_OUTPUT"

  deploy-web:
    name: Deploy web (hosting, rules, indexes)
    needs: [ci, changes]
    # Deploys happen only from main: a push deploys what it changed, a
    # workflow_dispatch deploys what its inputs ask for. On pull requests
    # this job shows as skipped.
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # Overlapping merges queue rather than interleave. The group orders runs
    # by when their ci job finished, not by commit — the stand-down check
    # below is what keeps an older commit from deploying over a newer one.
    # The functions job uses its own group so a requested functions deploy
    # is never the pending run this group discards.
    concurrency:
      group: deploy-web
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # The ci job builds against stub config for lint/test purposes; that
      # artifact must never be served. This job rebuilds from the real
      # production config held in the PROD_ENVIRONMENT_TS secret. The .vscode
      # stub is still required: tsconfig.app.json includes src/**/*.ts, so
      # environment.ts is type-checked even though fileReplacements swaps it
      # out of the bundle, and its re-export must resolve.
      - name: Create production environment files
        env:
          PROD_ENVIRONMENT_TS: ${{ secrets.PROD_ENVIRONMENT_TS }}
        run: |
          if [ -z "$PROD_ENVIRONMENT_TS" ]; then
            echo "The PROD_ENVIRONMENT_TS secret is not set" >&2
            exit 1
          fi
          mkdir -p .vscode
          cat > .vscode/environment.ts << 'EOF'
          export const environment = {
            production: false,
            firebase: {
              apiKey: 'ci-stub',
              authDomain: 'ci-stub',
              projectId: 'ci-stub',
              storageBucket: 'ci-stub',
              messagingSenderId: 'ci-stub',
              appId: 'ci-stub',
              measurementId: 'ci-stub'
            },
            donationUrlPaypal: ''
          };
          EOF
          printf '%s' "$PROD_ENVIRONMENT_TS" > src/environments/environment.prod-local.ts

      # Nothing else can tell this secret apart from the committed digest
      # taken the last time someone ran the sync ritual, so a drift here
      # would otherwise ship silently. Runs before the production build so
      # a mismatch fails in seconds, not after it. On mismatch: finish the
      # ritual — edit the local file, `gh secret set PROD_ENVIRONMENT_TS <
      # src/environments/environment.prod-local.ts`, `node
      # scripts/check-prod-env.mjs --write`, commit the digest — then
      # re-run.
      - name: Verify PROD_ENVIRONMENT_TS matches the committed digest
        run: node scripts/check-prod-env.mjs --self-test && node scripts/check-prod-env.mjs

      - name: Build (production)
        run: npm run build:web

      # A slow run can reach this point carrying a commit main has already
      # moved past. If the newer commits change nothing this job deploys,
      # proceeding is safe — the built output is identical. If they do, stand
      # down: the newer commit's own run deploys them, and deploying here
      # would publish stale content over it. This case statement mirrors the
      # changes job's classifier, as deploy-functions' does, and the "What
      # deploys when" table in docs/deploy.md states all three in prose — the
      # three case statements and that table change together.
      - name: Stand down if a newer commit changes what this job deploys
        id: tip
        run: |
          git fetch --quiet --depth=1 origin main
          tip=$(git rev-parse FETCH_HEAD)
          proceed=true
          if [ "$tip" != "$GITHUB_SHA" ]; then
            while IFS= read -r f; do
              case "$f" in
                docs/*|ios/*|.github/*|*.md|.gitignore|LICENSE) ;;
                functions/*) ;;
                firebase.json) proceed=false ;;
                *) proceed=false ;;
              esac
            done < <(git -c core.quotePath=false diff --no-renames --name-only "$GITHUB_SHA" "$tip")
          fi
          if [ "$proceed" = false ]; then
            echo "main moved to $tip with web-relevant changes; leaving the deploy to that commit's run"
          fi
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

      # Authentication happens after the build so the credential file never
      # exists while npm scripts run. The action exports
      # GOOGLE_APPLICATION_CREDENTIALS, which firebase-tools picks up.
      - name: Authenticate to Google Cloud
        if: steps.tip.outputs.proceed == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # --non-interactive without --force: index additions apply, but the CLI
      # declines index deletions and continues — deleting an index stays a
      # deliberate local act with a human reading the list (see
      # docs/emulator-blind-spots.md). Functions never deploy from here.
      - name: Deploy
        if: steps.tip.outputs.proceed == 'true'
        run: npx firebase deploy --only hosting,firestore,storage --project home-accounter --non-interactive -m "$GITHUB_SHA"

      # Firestore builds composite indexes asynchronously: the deploy above
      # returns as soon as the definitions are accepted, so this job could go
      # green while the index a new query needs is still building and that
      # query still throws failed-precondition. This polls the Firestore Admin
      # API until every index is READY, which closes ADR 0077's index-wait gap
      # — until now, watching the console until every entry read Enabled was
      # the manual half of the release. The deploy has already happened when
      # this runs, so red here means shipped but unverified, never "nothing
      # was released".
      - name: Wait for Firestore composite indexes
        if: steps.tip.outputs.proceed == 'true'
        timeout-minutes: 15
        run: node scripts/wait-for-indexes.mjs

  deploy-functions:
    name: Deploy functions
    needs: [ci, changes]
    # Fires when a merge touches functions/ or firebase.json, or when a
    # dispatch asks for it — the secret-rotation re-pin involves no code
    # change, so the dispatch input is the only path that covers it (see
    # docs/feedback.md).
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    # Serialized against itself only; a shared group would let a newer web
    # deploy discard a pending functions deploy.
    concurrency:
      group: deploy-functions
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # The root install exists to provide firebase-tools at the
      # lockfile-pinned version — the same CLI developers run locally,
      # updated through reviewed Dependabot PRs rather than whatever @latest
      # resolves to.
      - name: Install dependencies
        run: npm ci

      # The same gate the ci job applies, kept here so a dispatch-triggered
      # deploy is tested even though no PR ran. firebase.json's predeploy
      # re-runs install and build during the deploy itself.
      - name: Functions build & test
        run: |
          npm --prefix functions ci
          npm --prefix functions test

      # Same stand-down rule as deploy-web, judged against this job's own
      # target: proceed unless main has moved past this commit with changes
      # that touch the functions deploy. This case statement mirrors the
      # changes job's classifier, as deploy-web's does, and the "What deploys
      # when" table in docs/deploy.md states all three in prose — the three
      # case statements and that table change together.
      - name: Stand down if a newer commit changes what this job deploys
        id: tip
        run: |
          git fetch --quiet --depth=1 origin main
          tip=$(git rev-parse FETCH_HEAD)
          proceed=true
          if [ "$tip" != "$GITHUB_SHA" ]; then
            while IFS= read -r f; do
              case "$f" in
                docs/*|ios/*|.github/*|*.md|.gitignore|LICENSE) ;;
                functions/*) proceed=false ;;
                firebase.json) proceed=false ;;
                *) ;;
              esac
            done < <(git -c core.quotePath=false diff --no-renames --name-only "$GITHUB_SHA" "$tip")
          fi
          if [ "$proceed" = false ]; then
            echo "main moved to $tip with functions-relevant changes; leaving the deploy to that commit's run"
          fi
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        if: steps.tip.outputs.proceed == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # A full deploy re-pins every secret to its latest live version — the
      # repair and the habit docs/feedback.md records. --only always; a bare
      # deploy would drag every other target along.
      - name: Deploy
        if: steps.tip.outputs.proceed == 'true'
        run: npx firebase deploy --only functions --project home-accounter --non-interactive
