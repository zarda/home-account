<app-dialog-header
  [titleKey]="isEdit ? 'settings.editCategory' : 'settings.addCategory'"
  (closed)="cancel()"
/>

<mat-dialog-content>
  <div class="form-content">
    <!-- Category Name -->
    <mat-form-field appearance="outline">
      <mat-label>{{ 'settings.categoryName' | translate }}</mat-label>
      <input
        matInput
        [(ngModel)]="name"
        [placeholder]="'settings.categoryNamePlaceholder' | translate"
        maxlength="50"
      >
    </mat-form-field>

    <!-- Icon Selection -->
    <div class="icon-section">
      <span class="section-label">{{ 'settings.icon' | translate }}</span>
      <div
        class="icons-grid"
        role="group"
        [attr.aria-label]="'settings.iconSelection' | translate"
      >
        @for (icon of icons; track icon) {
          <button
            type="button"
            class="icon-btn"
            [attr.aria-label]="iconNameKeys[icon] | translate"
            [attr.aria-pressed]="selectedIcon === icon"
            [class.selected]="selectedIcon === icon"
            [style.color]="(selectedIcon === icon ? selectedColor : '') | categoryGlyph:'iconGrid'"
            (click)="selectIcon(icon)"
          >
            <mat-icon>{{ icon }}</mat-icon>
          </button>
        }
      </div>
    </div>

    <!-- Color Selection -->
    <div class="color-section">
      <span class="section-label">{{ 'settings.color' | translate }}</span>
      <div
        class="colors-grid"
        role="group"
        [attr.aria-label]="'settings.colorSelection' | translate"
      >
        @for (color of colors; track color; let i = $index) {
          <!-- colors:allow-start(category-data) each swatch is filled with the colour it offers -->
          <button
            type="button"
            class="color-btn"
            [attr.aria-label]="colorNameKeys[i] | translate"
            [attr.aria-pressed]="selectedColor === color"
            [class.selected]="selectedColor === color"
            [style.background-color]="color"
            (click)="selectColor(color)"
          >
            @if (selectedColor === color) {
              <mat-icon [style.color]="color | readableOn">check</mat-icon>
            }
          </button>
          <!-- colors:allow-end -->
        }
      </div>
    </div>

    <!-- Preview -->
    <div class="preview-section">
      <span class="section-label">{{ 'settings.preview' | translate }}</span>
      <div class="preview-item">
        <app-category-chip appearance="tile" [icon]="selectedIcon" [color]="selectedColor" />
        <span class="preview-name">{{ name || ('settings.categoryName' | translate) }}</span>
      </div>
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">{{ 'common.cancel' | translate }}</button>
  <button
    mat-flat-button
    color="primary"
    (click)="save()"
    [disabled]="!isValid"
  >
    {{ (isEdit ? 'settings.saveChanges' : 'settings.createCategory') | translate }}
  </button>
</mat-dialog-actions>
