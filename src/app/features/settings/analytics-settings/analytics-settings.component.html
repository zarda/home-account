<div class="analytics-settings">
  <span class="section-label" id="usage-analytics-label">{{ 'analytics.settingsTitle' | translate }}</span>
  <p class="section-description">{{ 'analytics.settingsDescription' | translate }}</p>

  <!-- The section names the group; the switch is named by the words it shows.
       The note is bound through the toggle's input, which hands it to the
       switch; an attribute binding stays on the host. The input takes a
       string, and an empty one names no note. -->
  <div class="setting-row" role="group" aria-labelledby="usage-analytics-label">
    <mat-slide-toggle
      [checked]="enabled()"
      [disabled]="!canDisable()"
      (change)="onEnabledChange($event.checked)"
      [aria-describedby]="canDisable() ? '' : 'usage-analytics-tier-note'"
    >
      {{ 'analytics.enable' | translate }}
    </mat-slide-toggle>
  </div>

  @if (!canDisable()) {
    <p class="analytics-tier-note" id="usage-analytics-tier-note">
      {{ 'analytics.freeTierNotice' | translate }}
    </p>
  }

  <p class="analytics-disclaimer">{{ 'analytics.disclaimer' | translate }}</p>
</div>
