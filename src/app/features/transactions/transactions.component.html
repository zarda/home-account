<div class="flex flex-col gap-4">
  <app-page-header titleKey="transactions.title">
    <span header-title-suffix class="text-base font-normal text-gray-400 dark:text-gray-500 leading-none">({{ transactionCount() }})</span>

    <!-- Add Menu Button. Hidden on mobile: the bottom-nav center FAB opens
         the same three entries (manual add, camera capture, photo import). -->
    <ng-container ngProjectAs="[header-actions]">
      @if (!deviceService.isMobile()) {
        <button
          mat-fab
          color="primary"
          [matMenuTriggerFor]="addMenu"
          class="!w-12 !h-12 !min-w-0"
          [attr.aria-label]="'transactions.addTransaction' | translate"
        >
          <mat-icon>add</mat-icon>
        </button>
        <mat-menu #addMenu="matMenu" xPosition="before">
          <button mat-menu-item (click)="openAddDialog()">
            <mat-icon>add</mat-icon>
            <span>{{ 'transactions.addTransaction' | translate }}</span>
          </button>
          <button mat-menu-item (click)="openCameraDialog()">
            <mat-icon>photo_camera</mat-icon>
            <span>{{ 'import.importFromCamera' | translate }}</span>
          </button>
          <button mat-menu-item (click)="navigateToImportFile()">
            <mat-icon>upload_file</mat-icon>
            <span>{{ 'import.importFromFile' | translate }}</span>
          </button>
        </mat-menu>
      }
    </ng-container>
  </app-page-header>

  <!-- Filters -->
  <app-transaction-filters
    [categories]="expenseCategories()"
    [incomeCategories]="incomeCategories()"
    [initialDate]="initialDate()"
    [showAll]="showAll()"
    (filtersChanged)="onFiltersChanged($event)"
  />

  <!-- Transaction List -->
  @if (isLoading()) {
    <app-loading-spinner [message]="'transactions.loading' | translate" />
  } @else {
    <app-transaction-list
      [transactions]="transactions()"
      [categories]="categoriesMap()"
      (edit)="openEditDialog($event)"
      (delete)="onDeleteTransaction($event)"
    />
  }
</div>
