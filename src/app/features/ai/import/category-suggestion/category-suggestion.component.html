<div class="category-suggestion">
  <!-- The grade's dot: green/amber/red, which the reviewer scans to decide
       which suggestions to trust and which to re-check. Its name says where
       the grade came from. -->
  <span
    class="confidence-dot"
    [class]="confidenceClass()"
    [matTooltip]="confidenceTooltip()"
    matTooltipPosition="above"
    role="img"
    [attr.aria-label]="confidenceTooltip()"
  ></span>
  <button
    mat-stroked-button
    [matMenuTriggerFor]="categoryMenu"
    class="category-button"
  >
    <mat-icon class="category-icon" [style.color]="categoryColor() | categoryGlyph:'reviewCard'">
      {{ categoryIcon() }}
    </mat-icon>
    <span class="category-name" appFitText>{{ categoryName() }}</span>
    <mat-icon iconPositionEnd class="dropdown-icon">arrow_drop_down</mat-icon>
  </button>

  <mat-menu #categoryMenu="matMenu" class="category-menu">
    @for (category of sortedCategories(); track category.id) {
      <button
        mat-menu-item
        (click)="selectCategory(category.id)"
        [class.selected]="category.id === suggestedCategoryId()"
      >
        <mat-icon [style.color]="category.color | categoryGlyph:'menu'">{{ category.icon }}</mat-icon>
        <span>{{ translateName(category.name) }}</span>
      </button>
    }
  </mat-menu>
</div>
