<div class="budgets-page p-4 md:p-6">
  <app-page-header titleKey="budget.title" class="block mb-6" />

  <!-- Tabs: natural width, left-aligned (two tabs no longer stretch across
       the full page). -->
  <mat-tab-group
    class="budget-tabs"
    [animationDuration]="tabAnimationDuration()"
    [mat-stretch-tabs]="false"
    [selectedIndex]="selectedTabIndex"
  >
    <!-- Budgets Tab -->
    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="tab-icon">savings</mat-icon>
        <span>{{ 'budget.budgets' | translate }}</span>
        @if (budgetCount() > 0) {
          <span class="tab-badge">{{ budgetCount() }}</span>
        }
      </ng-template>

      <div class="tab-content">
        <!-- Add Budget Button -->
        <div class="tab-header">
          <p class="tab-description">{{ 'budget.budgetsDescription' | translate }}</p>
          <button mat-flat-button color="primary" (click)="openAddDialog()">
            <mat-icon>add</mat-icon>
            {{ 'budget.addBudget' | translate }}
          </button>
        </div>

        <!-- Budget Content -->
        @if (isLoading()) {
          <app-loading-spinner />
        } @else if (budgets().length === 0) {
          <app-empty-state
            icon="savings"
            [title]="'budget.noBudgets' | translate"
            [description]="'budget.noBudgetsDescription' | translate"
            [actionLabel]="'budget.createBudget' | translate"
            actionIcon="add"
            (action)="openAddDialog()"
          />
        } @else {
          <div class="budget-grid">
            <app-budget-overview
              [budgets]="budgets()"
              [categories]="categoriesMap()"
              (edit)="openEditDialog($event)"
              (delete)="confirmDelete($event)"
            />
          </div>
        }
      </div>
    </mat-tab>

    <!-- Recurring Transactions Tab -->
    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="tab-icon">repeat</mat-icon>
        <span>{{ 'budget.recurring' | translate }}</span>
      </ng-template>

      <div class="tab-content">
        <app-recurring-transactions />
      </div>
    </mat-tab>

    <!-- Goals Tab -->
    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="tab-icon">flag</mat-icon>
        <span>{{ 'budget.goals' | translate }}</span>
      </ng-template>

      <div class="tab-content">
        <app-goals />
      </div>
    </mat-tab>
  </mat-tab-group>
</div>
