<div class="reports-container">
  <app-page-header titleKey="reports.title" subtitleKey="reports.subtitle" class="header-section">
    <div header-actions class="header-right">
      <app-period-selector (selectionChange)="onPeriodSelection($event)" />

      <button mat-flat-button color="primary" (click)="openExportDialog()" class="export-btn">
        <mat-icon>download</mat-icon>
        <span class="desktop-label">{{ 'common.export' | translate }}</span>
      </button>
    </div>
  </app-page-header>

  @if (isLoading()) {
    <app-loading-spinner [message]="'reports.loadingData' | translate" />
  } @else {
    <!-- Tabs Navigation -->
    <mat-tab-group
      [(selectedIndex)]="selectedTabIndex"
      class="reports-tabs"
      animationDuration="200ms"
    >
      <mat-tab>
        <ng-template mat-tab-label>
          <mat-icon class="tab-icon">show_chart</mat-icon>
          <span class="tab-label">{{ 'reports.spendingAnalysis' | translate }}</span>
        </ng-template>
        <div class="tab-content">
          <app-spending-analysis
            [transactions]="transactions()"
            [categories]="categories()"
            [dateRange]="dateRange()"
            [currency]="baseCurrency()"
          />
        </div>
      </mat-tab>

      <mat-tab>
        <ng-template mat-tab-label>
          <mat-icon class="tab-icon">pie_chart</mat-icon>
          <span class="tab-label">{{ 'reports.categoryBreakdown' | translate }}</span>
        </ng-template>
        <div class="tab-content">
          <app-category-breakdown
            [transactions]="transactions()"
            [categories]="categories()"
            [currency]="baseCurrency()"
          />
        </div>
      </mat-tab>

      <mat-tab>
        <ng-template mat-tab-label>
          <mat-icon class="tab-icon">bar_chart</mat-icon>
          <span class="tab-label">{{ 'reports.monthlyComparison' | translate }}</span>
        </ng-template>
        <div class="tab-content">
          <app-monthly-comparison
            [transactions]="transactions()"
            [dateRange]="dateRange()"
            [currency]="baseCurrency()"
          />
        </div>
      </mat-tab>
    </mat-tab-group>
  }
</div>
