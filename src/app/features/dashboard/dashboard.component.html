<div class="dashboard-container">
  <app-page-header titleKey="dashboard.title" class="header-section">
    <p header-subtitle class="text-gray-500 dark:text-gray-400 text-sm mt-1 mb-0">
      {{ 'common.welcome' | translate }}, {{ userName() }}
    </p>

    <app-period-selector header-actions (selectionChange)="onPeriodSelection($event)" />
  </app-page-header>

  <!-- Budget threshold alerts: inline + dismissible, not a standing snackbar -->
  <app-budget-alert-banner />

  <!-- Last week, above the grid rather than in it: the recap's window is
       fixed, while every card below follows the selected period. -->
  <app-weekly-recap
    [alerts]="budgetAlerts()"
    [upcoming]="upcomingOccurrences()"
    [baseCurrency]="baseCurrency()"
    [categories]="categoriesMap()"
  />

  @if (showInitialSpinner()) {
    <app-loading-spinner [message]="'dashboard.loadingData' | translate" />
  } @else {
    <!-- Refetch (period change) keeps content mounted; a thin bar signals work -->
    @if (isRefetching()) {
      <mat-progress-bar mode="indeterminate" class="refetch-bar" />
    }

    <!-- Financial Summary Cards (shared) -->
    <app-financial-summary
      [income]="totalIncome()"
      [expenses]="totalExpenses()"
      [balance]="balance()"
      [currency]="baseCurrency()"
      [previousIncome]="previousPeriodData()?.income ?? null"
      [previousExpenses]="previousPeriodData()?.expense ?? null"
    />

    <!-- One DOM tree, reordered per breakpoint via grid-template-areas:
         desktop is an asymmetric main column (chart + AI insights) beside a
         right rail (recent transactions + budgets); mobile stacks them with
         recent transactions first. -->
    <div class="dashboard-grid" [class.has-budgets]="activeBudgets().length > 0">
      <app-ai-summary
        class="area-insights"
        [transactions]="transactions()"
        [period]="publishedPeriodOption()"
        [baseCurrency]="baseCurrency()"
        [previousPeriodData]="previousPeriodData()"
        [previousPeriodByCategory]="previousPeriodByCategory()"
        [historicalExpenses]="historicalExpenses()"
        [budgets]="activeBudgets()"
        [goals]="activeGoals()"
      />

      <app-spending-chart
        class="area-chart"
        [categoryTotals]="categoryTotals()"
        [categories]="categories()"
        (categoryActivated)="onCategoryActivated($event)"
      />

      <app-recent-transactions
        class="area-recent"
        [transactions]="recentTransactions()"
        [categories]="categoriesMap()"
      />

      <app-upcoming-bills
        class="area-upcoming"
        [occurrences]="upcomingOccurrences()"
        [categories]="categoriesMap()"
        [baseCurrency]="baseCurrency()"
        [net]="upcomingNet()"
      />

      @if (activeBudgets().length > 0) {
        <app-budget-progress
          class="area-budgets"
          [budgets]="activeBudgets()"
          [categories]="categoriesMap()"
        />
      }
    </div>
  }
</div>
