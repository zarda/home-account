<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
  <app-stat-card
    [label]="'common.totalIncome' | translate"
    [labelSuffix]="currency()"
    [value]="formatAmount(income())"
    icon="trending_up"
    tone="income"
    [delta]="incomeChange()"
    [deltaCaption]="'dashboard.vsPreviousPeriod' | translate"
  />

  <app-stat-card
    [label]="'common.totalExpenses' | translate"
    [labelSuffix]="currency()"
    [value]="formatAmount(expenses())"
    icon="trending_down"
    tone="expense"
    [delta]="expensesChange()"
    [deltaCaption]="'dashboard.vsPreviousPeriod' | translate"
    [invertDelta]="true"
  />

  <app-stat-card
    [label]="'common.netBalance' | translate"
    [labelSuffix]="currency()"
    [value]="formatAmount(balance())"
    icon="account_balance_wallet"
    [tone]="balance() >= 0 ? 'positive' : 'negative'"
    [delta]="balanceChange()"
    [deltaCaption]="'dashboard.vsPreviousPeriod' | translate"
  />
</div>
