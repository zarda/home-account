<mat-card class="card">
  <div class="card-header">
    <h3 class="card-title">{{ 'dashboard.spendingByCategory' | translate }}</h3>
  </div>

  <div class="card-content">
    @if (categoryTotals().length === 0) {
      <div class="empty-container">
        <app-empty-state
          icon="pie_chart"
          [title]="'dashboard.noExpenses' | translate"
          [description]="'dashboard.addExpensesToSeeBreakdown' | translate"
        />
      </div>
    } @else {
      <div class="chart-container">
        <div class="chart-wrapper">
          <canvas
            baseChart
            [data]="chartData()"
            [type]="chartType"
            [options]="chartOptions()"
            (chartClick)="onChartClick($event)"
          ></canvas>
        </div>

        <div class="legend-container">
          <ul class="legend-list">
            @for (item of topCategories(); track item.categoryId) {
              <li>
                <button
                  type="button"
                  class="legend-item"
                  [attr.aria-label]="legendAriaLabel(item)"
                  (click)="onLegendActivate(item.categoryId)"
                >
                  <!-- colors:allow-start(category-data) the tile is filled with the category's own colour, as its slice is -->
                  <span
                    class="legend-icon"
                    [style.background-color]="getCategoryColor(item.categoryId)"
                  >
                    <mat-icon [style.color]="getCategoryColor(item.categoryId) | readableOn">{{
                      getCategoryIcon(item.categoryId)
                    }}</mat-icon>
                  </span>
                  <!-- colors:allow-end -->
                  <div class="legend-content">
                    <div class="legend-row">
                      <span class="legend-name">{{ getCategoryName(item.categoryId) }}</span>
                      <span class="legend-amount">{{ formatAmount(item.total) }}</span>
                    </div>
                    <div class="legend-progress-row">
                      <div class="legend-progress">
                        <!-- colors:allow-start(category-data) the share bar is filled with the category's own colour, as its slice is, and carries no text -->
                        <div
                          class="legend-progress-bar"
                          [style.width.%]="getPercentage(item.total)"
                          [style.background-color]="getCategoryColor(item.categoryId)"
                        ></div>
                        <!-- colors:allow-end -->
                      </div>
                      <span class="legend-percentage">{{ getPercentage(item.total).toFixed(0) }}%</span>
                    </div>
                  </div>
                </button>
              </li>
            }
          </ul>
        </div>
      </div>
    }
  </div>
</mat-card>
