<mat-card class="card">
  <!-- Header -->
  <div class="card-header">
    <h2 class="card-title">{{ 'dashboard.recentTransactions' | translate }}</h2>
    <div class="header-actions">
      <!-- Upcoming Bills shows a View All beside this one, so each names its card. -->
      <a
        routerLink="/transactions"
        [queryParams]="{showAll: true}"
        class="view-all-link"
        [attr.aria-label]="'dashboard.viewAllNamed' | translate: { name: 'dashboard.recentTransactions' | translate }"
      >
        {{ 'dashboard.viewAll' | translate }}
        <mat-icon class="view-all-icon">chevron_right</mat-icon>
      </a>
      <ng-content select="[card-actions]" />
    </div>
  </div>

  <!-- Content -->
  <div class="card-content">
    @if (transactions().length === 0) {
      <div class="empty-container">
        <app-empty-state
          icon="receipt_long"
          [title]="'transactions.noTransactions' | translate"
          [description]="'dashboard.addFirstTransaction' | translate"
          [actionLabel]="'transactions.addTransaction' | translate"
          actionIcon="add"
          (action)="onAddTransaction()"
        />
      </div>
    } @else {
      <div class="transaction-list">
        @for (transaction of transactions(); track transaction.id; let last = $last) {
          <app-transaction-row
            [transaction]="transaction"
            [categories]="categories()"
            [householdNames]="householdNames()"
            (activate)="onTransactionClick($event)"
          />
          @if (!last) {
            <div class="divider"></div>
          }
        }
      </div>
    }
  </div>
</mat-card>
