<span class="member-avatar" aria-hidden="true">
  @if (photo(); as src) {
    <!-- no-referrer: an account picture is served by its sign-in provider,
         which has no business learning which page shows it. -->
    <img class="member-photo" [src]="src" alt="" referrerpolicy="no-referrer" (error)="photoFailed.set(true)" />
  } @else if (initial()) {
    <span class="member-initial">{{ initial() }}</span>
  } @else {
    <mat-icon class="member-placeholder">person</mat-icon>
  }
</span>
<span class="member-name">{{ name() || ('household.unnamedMember' | translate) }}</span>
