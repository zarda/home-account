<div class="p-6">
  @if (data.icon) {
    <div class="flex justify-center mb-4">
      <div
        class="w-12 h-12 rounded-full flex items-center justify-center"
        [class.bg-error-soft]="data.confirmColor === 'warn'"
        [class.icon-circle-brand]="data.confirmColor !== 'warn'"
      >
        <mat-icon
          class="!text-2xl"
          [class.text-error-text]="data.confirmColor === 'warn'"
          [class.text-brand-text]="data.confirmColor !== 'warn'"
        >
          {{ data.icon }}
        </mat-icon>
      </div>
    </div>
  }

  <h2 mat-dialog-title class="text-lg font-semibold text-center mb-2">
    {{ data.title }}
  </h2>

  <mat-dialog-content>
    <p class="text-sm text-fg-secondary text-center">{{ data.message }}</p>
    @if (data.requireText) {
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="mt-4 w-full">
        <mat-label>{{ data.requireText }}</mat-label>
        <input
          matInput
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          (input)="onTyped($any($event.target).value)"
        />
      </mat-form-field>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="center" class="mt-6 gap-3">
    <button mat-stroked-button (click)="onCancel()">
      {{ data.cancelLabel || ('common.cancel' | translate) }}
    </button>
    <button
      mat-flat-button
      [color]="data.confirmColor || 'primary'"
      [disabled]="confirmDisabled()"
      (click)="onConfirm()"
    >
      {{ data.confirmLabel || ('common.confirm' | translate) }}
    </button>
  </mat-dialog-actions>
</div>
