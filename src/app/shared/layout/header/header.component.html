<mat-toolbar class="header-toolbar">
  <button
    mat-icon-button
    (click)="toggleSidebar.emit()"
    [matTooltip]="'common.toggleSidebar' | translate"
    [attr.aria-label]="'common.toggleSidebar' | translate"
    class="menu-button"
  >
    <mat-icon>{{ isSidebarOpen ? 'menu_open' : 'menu' }}</mat-icon>
  </button>

  <span class="app-title" appFitText>{{ 'app.title' | translate }}</span>

  <span class="spacer"></span>

  <!-- Command palette: the only way in on a touch screen. The one-time '?'
       hint comes first, so focus meets it in the order it is drawn, and its
       dismiss hands focus on to the button rather than dropping it. -->
  <span class="palette-anchor">
    @if (showShortcutsHint()) {
      <div class="shortcuts-hint">
        <mat-icon class="shortcuts-hint-icon">keyboard</mat-icon>
        <p class="shortcuts-hint-text">{{ 'shortcuts.hint' | translate }}</p>
        <button
          mat-icon-button
          type="button"
          class="shortcuts-hint-dismiss"
          (click)="dismissShortcutsHint(); paletteButton.focus()"
          [attr.aria-label]="'shortcuts.hintDismiss' | translate"
        >
          <mat-icon>close</mat-icon>
        </button>
      </div>
    }
    <button
      #paletteButton="matButton"
      mat-icon-button
      class="palette-button"
      aria-haspopup="dialog"
      (click)="openPalette()"
      [matTooltip]="'palette.title' | translate"
      [attr.aria-label]="'palette.title' | translate"
    >
      <mat-icon>bolt</mat-icon>
    </button>
  </span>

  <!-- Smart search -->
  <button
    mat-icon-button
    (click)="openSearchDialog()"
    [matTooltip]="'aiSearch.title' | translate"
    [attr.aria-label]="'aiSearch.title' | translate"
  >
    <mat-icon>travel_explore</mat-icon>
  </button>

  <!-- User Menu -->
  @if (currentUser(); as user) {
    <button
      mat-icon-button
      [matMenuTriggerFor]="userMenu"
      class="user-menu-button"
      [attr.aria-label]="'common.userMenu' | translate"
    >
      @if (user.photoURL && !avatarFailed()) {
        <img
          [src]="user.photoURL"
          [alt]="user.displayName"
          class="user-avatar"
          (error)="avatarFailed.set(true)"
        />
      } @else {
        <mat-icon>account_circle</mat-icon>
      }
    </button>

    <mat-menu #userMenu="matMenu" xPosition="before">
      <div class="user-info">
        <p class="user-name">{{ user.displayName }}</p>
        <p class="user-email">{{ user.email }}</p>
      </div>
      <button mat-menu-item routerLink="/settings">
        <mat-icon>settings</mat-icon>
        <span>{{ 'common.settings' | translate }}</span>
      </button>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>{{ 'auth.signOut' | translate }}</span>
      </button>
    </mat-menu>
  }
</mat-toolbar>
