<nav class="bottom-nav">
  @for (item of navItems(); track item.route) {
    @if (item.isAction) {
      <button
        [matMenuTriggerFor]="addMenu"
        class="action-button"
        [attr.aria-label]="item.label"
      >
        <mat-icon>{{ item.icon }}</mat-icon>
      </button>
      <mat-menu #addMenu="matMenu" yPosition="above" class="add-menu-above">
        <button mat-menu-item (click)="openAddTransaction()">
          <mat-icon>edit</mat-icon>
          <span>{{ 'transactions.addManually' | translate }}</span>
        </button>
        <button mat-menu-item (click)="openScanReceipt()">
          <mat-icon>photo_camera</mat-icon>
          <span>{{ 'ai.scanReceipt' | translate }}</span>
        </button>
        <button mat-menu-item (click)="openImportPhotos()">
          <mat-icon>photo_library</mat-icon>
          <span>{{ 'import.importPhotos' | translate }}</span>
        </button>
      </mat-menu>
    } @else {
      <!--
        aria-current carries the active state, not the aria-label: folding it
        into the name would stop the accessible name matching the visible
        text (ADR 0055).
      -->
      <a
        [routerLink]="item.route"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
        class="nav-item"
        [attr.aria-label]="item.label"
      >
        <span class="icon-pill"><mat-icon>{{ item.icon }}</mat-icon></span>
        <span class="nav-label" appFitText>{{ item.label }}</span>
      </a>
    }
  }
</nav>
