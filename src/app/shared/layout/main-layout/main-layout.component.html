<!-- Header -->
<app-header
  [isSidebarOpen]="sidebarVisible()"
  (toggleSidebar)="toggleSidebar()"
/>

<!-- Docked sidebar (desktop): part of the layout, no backdrop, content offset -->
@if (showDockedSidebar()) {
  <div class="sidebar-docked">
    <app-sidebar [isExpanded]="true" (navItemClicked)="onNavItemClicked()" />
  </div>
}

<!-- Overlay drawer (tablet/mobile only): modal, with backdrop + focus trap -->
@if (isOverlayMode() && sidebarOpen()) {
  <div
    class="sidebar-backdrop"
    role="button"
    tabindex="0"
    aria-label="Close sidebar"
    (click)="closeSidebar()"
    (keydown.enter)="closeSidebar()"
    (keydown.escape)="closeSidebar()"
  ></div>
  <div
    class="sidebar-drawer"
    role="dialog"
    aria-modal="true"
    aria-label="Navigation"
    cdkTrapFocus
    cdkTrapFocusAutoCapture
  >
    <app-sidebar [isExpanded]="true" (navItemClicked)="onNavItemClicked()" />
  </div>
}

<!-- Main Content -->
<div
  class="main-container"
  [class.with-bottom-nav]="isMobile()"
  [class.with-docked-sidebar]="showDockedSidebar()"
>
  <div class="content-wrapper">
    <router-outlet />
  </div>
</div>

<!-- Bottom Navigation (mobile only) -->
<div class="bottom-nav-container" [class.visible]="isMobile()">
  <app-bottom-nav />
</div>
